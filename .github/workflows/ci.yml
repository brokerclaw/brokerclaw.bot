name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Contract tests
        working-directory: packages/contracts
        run: forge test -vvv

      - name: TypeScript tests (unit)
        run: pnpm test --filter='!@brokerclaw/e2e'

      - name: Start Anvil
        run: anvil &

      - name: Wait for Anvil
        run: |
          for i in $(seq 1 10); do
            curl -sf http://127.0.0.1:8545 -X POST -H 'Content-Type: application/json' \
              -d '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}' && break
            sleep 1
          done

      - name: E2E tests
        run: pnpm test:e2e
